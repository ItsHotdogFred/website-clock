<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Location Display -->
        <div id="location" class="location-text">New Zealand (NZST)</div>

        <!-- Main Clock Display -->
        <div id="clock" class="clock-text">00:00:00</div>

        <!-- Controls -->
        <div class="controls">
            <button id="clock-mode" class="btn hidden">Clock</button>
            <button id="stopwatch-mode" class="btn">Stopwatch</button>
            <button id="timer-mode" class="btn">Timer</button>
            <button id="format-toggle" class="btn">Switch to 24h</button>
            <button id="theme-toggle" class="btn">Dark Mode</button>
            <button onclick="playTick()" class="btn">Play Sound</button>
        </div>

        <div id="stopwatch-controls" class="controls stopwatch-controls hidden">
            <button id="stopwatch-start" class="btn">Start</button>
            <button id="stopwatch-lap" class="btn">Lap</button>
            <button id="stopwatch-reset" class="btn">Reset</button>
        </div>

        <div id="timer-controls" class="timer-controls hidden">
            <input id="timer-minutes" class="timer-input" type="number" min="0" max="999" value="1" aria-label="Timer minutes">
            <span class="timer-separator">minutes</span>
            <div class="controls timer-buttons">
                <button id="timer-start" class="btn">Start</button>
                <button id="timer-reset" class="btn">Reset</button>
            </div>
        </div>

        <ol id="lap-list" class="lap-list hidden"></ol>
    </div>

    <audio id="tik-audio" preload="auto">
        <source src="tik.wav" type="audio/wav">
    </audio>
    <audio id="tok-audio" preload="auto">
        <source src="tok.wav" type="audio/wav">
    </audio>
    <audio loop id="background-audio">
        <source src="background.wav" type="audio/wav">
    </audio>
    <audio id="man-audio">
        <source src="manScreaming.mp3" type="audio/wav">
    </audio>

    <script src="script.js"></script>
</body>
</html>
