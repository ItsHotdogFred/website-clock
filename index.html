<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Location Display -->
        <div id="location" class="location-text">New Zealand (NZST)</div>

        <!-- Main Clock Display -->
        <div id="clock" class="clock-text">00:00:00</div>

        <!-- Controls -->
        <div class="controls">
            <button id="format-toggle" class="btn">Switch to 24h</button>
            <button id="theme-toggle" class="btn">Dark Mode</button>
            <button onclick="playTick()" class="btn">Play Sound</button>
        </div>
    </div>

    <audio id="tik-audio" preload="auto">
        <source src="tik.wav" type="audio/wav">
    </audio>
    <audio id="tok-audio" preload="auto">
        <source src="tok.wav" type="audio/wav">
    </audio>
    <audio loop id="background-audio">
        <source src="background.wav" type="audio/wav">
    </audio>
    <audio id="man-audio">
        <source src="manScreaming.mp3" type="audio/wav">
    </audio>

    <script src="script.js"></script>
</body>
</html>
